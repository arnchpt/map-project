# Sonde temporaire : exécute les contrôles politiques comme le robot. À supprimer avant fusion.
name: Sonde IPU
on:
  push:
    branches: [claude/project-thread-emu4w8]
    paths: [.github/workflows/sonde-ipu.yml]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/ipu-sieges.js; node scripts/politique.js; npm run build
      - run: git status --porcelain; git diff --stat; git diff data/; cat tmp/rapport-ipu.md; echo; cat tmp/rapport-politique.md
