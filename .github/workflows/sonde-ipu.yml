# Sonde temporaire : vérifie ce que l'API IPU Parline expose (sièges par parti). À supprimer avant fusion.
name: Sonde IPU
on:
  push:
    branches: [claude/project-thread-emu4w8]
    paths: [.github/workflows/sonde-ipu.yml]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://api.data.ipu.org/v1
          for c in US DE GB IN RU JP FR IT CA KR CN; do
            le=$(curl -sS -m 60 "$A/chambers/$c-LC01" | jq -r '.data.attributes.last_election.value.from // "aucune"' | cut -c1-10)
            code="$c-LC01-E${le//-/}"
            echo "== $c dernière élection $le ($code)"
            curl -sS -m 60 "$A/elections/$code" | jq -c '.data.attributes | {siege:.number_of_seats_at_stake.value, p:[.seats_per_parties.value[]? | [.party, .total_number_of_seats]]}'
          done
          echo "== partis"; for u in "parties/jp-liberal_democratic_party_ldp" "parties?filter=id%3Aeq%3Ajp-sanseito" "political_parties/jp-sanseito"; do curl -sS -m 60 "$A/$u" | head -c 1500; echo; done
