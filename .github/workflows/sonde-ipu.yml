# Sonde temporaire : vérifie ce que l'API IPU Parline expose (sièges par parti). À supprimer avant fusion.
name: Sonde IPU
on:
  push:
    branches: [claude/project-thread-emu4w8]
    paths: [.github/workflows/sonde-ipu.yml]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://api.data.ipu.org/v1
          curl -sS -m 60 "$A/elections/JP-LC01-E20260208" > e.json
          echo "== clés élection"; jq -r '.data.attributes | keys | join(" ")' e.json
          echo "== champs parti/siège"; jq -c '.data.attributes | to_entries[] | select(.key|test("part|seat|result|compos|group";"i")) | {k:.key, v:(.value|tostring|.[0:1500])}' e.json
          curl -sS -m 60 "$A/chambers/JP-LC01" > c.json
          echo "== clés chambre"; jq -r '.data.attributes | keys | join(" ")' c.json
          echo "== chambre parti/siège"; jq -c '.data.attributes | to_entries[] | select(.key|test("part|seat|compos|group|last_elec|election";"i")) | {k:.key, v:(.value|tostring|.[0:1500])}' c.json
          for f in "chamber%3Aeq%3AJP-LC01" "chamber_code%3Aeq%3AJP-LC01"; do echo "== liste $f"; curl -sS -m 60 "$A/elections?filter=$f&page%5Bsize%5D=3" | jq -c '{err:.errors, ids:[.data[]?.id]}'; done
          for e in RU-LC01-E20260920 RU-LC01-E20260918 US-LC01-E20241105 GB-LC01-E20240704; do echo "== $e"; curl -sS -m 60 "$A/elections/$e" | jq -c '{err:.errors[0].title, id:.data.id}'; done
